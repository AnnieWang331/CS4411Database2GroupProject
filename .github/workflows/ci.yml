name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch or PR cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff format
        run: ruff format --check --diff .
      - name: ruff check
        run: ruff check --output-format=github .
      - name: cfn-lint
        run: cfn-lint template.yaml

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DYNAMODB_ENDPOINT_URL: http://localhost:8000
      # Fail instead of skipping when DynamoDB Local isn't reachable (see tests/conftest.py).
      REQUIRE_DYNAMODB_LOCAL: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Start DynamoDB Local
        run: |
          docker run -d --name dynamodb-local -p 8000:8000 amazon/dynamodb-local:3.3.2 \
            -jar DynamoDBLocal.jar -inMemory -sharedDb
          # DynamoDB Local answers a bare GET with HTTP 400 once it's listening.
          for _ in $(seq 30); do
            curl -s -o /dev/null http://localhost:8000 && exit 0
            sleep 1
          done
          docker logs dynamodb-local
          exit 1
      - name: pytest
        run: pytest -ra
      - name: Create table and seed demo data
        run: |
          python scripts/create_table.py
          python scripts/seed.py

  # The README's Windows (PowerShell) steps on a fresh Windows machine. Windows runners can't run
  # Linux containers, so DynamoDB Local runs from AWS's JAR on Java instead (the README's no-Docker
  # option). Checkout uses Windows line endings here, as a grader's clone or unzip would.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      REQUIRE_DYNAMODB_LOCAL: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Virtual environment and packages
        run: |
          py -m venv .venv
          .venv\Scripts\Activate.ps1
          python -m pip install -r requirements-dev.txt
          Add-Content $env:GITHUB_PATH "$PWD\.venv\Scripts"
      - name: Download and start DynamoDB Local (JAR)
        run: |
          $base = "https://d1ni2b6xgvw0s0.cloudfront.net/v3.x/dynamodb_local_latest.zip"
          Invoke-WebRequest $base -OutFile ddb.zip
          Invoke-WebRequest "$base.sha256" -OutFile ddb.zip.sha256
          $expected = (Get-Content ddb.zip.sha256).Split(" ")[0]
          if ((Get-FileHash ddb.zip -Algorithm SHA256).Hash -ne $expected) { throw "checksum mismatch" }
          Expand-Archive ddb.zip -DestinationPath $env:RUNNER_TEMP\dynamodb-local
          Start-Process java -WorkingDirectory $env:RUNNER_TEMP\dynamodb-local `
            -ArgumentList "-Djava.library.path=./DynamoDBLocal_lib", "-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"
          foreach ($i in 1..30) {
            curl.exe -s -o NUL http://localhost:8000
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep 1
          }
          exit 1
      - name: Create table and seed demo data
        run: |
          $env:DYNAMODB_ENDPOINT_URL = "http://localhost:8000"
          python scripts/create_table.py
          python scripts/seed.py
      - name: pytest
        run: |
          $env:DYNAMODB_ENDPOINT_URL = "http://localhost:8000"
          pytest -ra
      - name: Benchmark and charts (single process, as on Windows)
        run: |
          $env:DYNAMODB_ENDPOINT_URL = "http://localhost:8000"
          python scripts/benchmark.py run --students 30 --scenarios hot-room
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $run = (Get-ChildItem benchmarks/results/bench-*-run.json | Sort-Object LastWriteTime | Select-Object -Last 1).Name -replace '^bench-(.*)-run\.json$', '$1'
          python scripts/bench_charts.py --run $run --out $env:RUNNER_TEMP\charts
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/bench_charts.py --run 20261126T024200Z --provisioned-run 20261126T024530Z --live-run 20261126T024546Z --out $env:RUNNER_TEMP\report-charts

  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Start PostgreSQL
        run: |
          docker run -d --name brainstorm-postgres -e POSTGRES_PASSWORD=postgres \
            -v "$PWD/sql:/sql:ro" postgres:18
          # Over TCP: during first start the image runs a temporary socket-only server.
          for _ in $(seq 30); do
            docker exec brainstorm-postgres pg_isready -q -h 127.0.0.1 -U postgres && exit 0
            sleep 1
          done
          docker logs brainstorm-postgres
          exit 1
      - name: Relational baseline (schema, checks, demo)
        run: |
          docker exec brainstorm-postgres psql -X -q -U postgres -v ON_ERROR_STOP=1 \
            -f /sql/schema.sql -f /sql/queries.sql -f /sql/checks.sql -f /sql/demo.sql
