AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  CS4411 Group 20 brainstorm board: DynamoDB table, HTTP API Lambda, WebSocket API with the
  stream Lambda for live updates, and web client hosting.

Parameters:
  TableName:
    Type: String
    Default: BrainstormBoard
    Description: DynamoDB table name (scripts read it from BRAINSTORM_TABLE).
  WebSocketStageName:
    Type: String
    Default: prod
    Description: Stage of the WebSocket API (part of its URL).
  BudgetEmail:
    Type: String
    Default: ""
    Description: Email for the monthly cost alert. Leave empty to skip the budget.
  BudgetLimitUsd:
    Type: Number
    Default: 5
    Description: Monthly budget in USD. You get an email at 80% actual and 100% forecast.

Conditions:
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    CodeUri: src/

Resources:
  # Same definition as src/brainstorm/schema.py (docs/data-model.md section 3).
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - room_id
              - code
              - topic
              - status
              - created_at
              - closed_at
              - expires_at
              - entity_type
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      # Encryption at rest with an AWS owned key (DynamoDB's default, no KMS cost). SSEEnabled
      # true would switch to the AWS managed KMS key (aws/dynamodb), which is billed per request.
      SSESpecification:
        SSEEnabled: false

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # The handler answers OPTIONS and sets the CORS headers itself (src/brainstorm/api.py),
      # so API Gateway's own CORS handling stays off.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: brainstorm.api.lambda_handler
      LoggingConfig:
        LogGroup: !Ref ApiFunctionLogs
      Environment:
        Variables:
          BRAINSTORM_TABLE: !Ref Table
          CORS_ALLOW_ORIGIN: !Sub https://${WebDistribution.DomainName}
      Policies:
        - Statement:
            # Transactions are authorised per action: Put/Update/Delete/ConditionCheck.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:ConditionCheckItem
              Resource: !GetAtt Table.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${Table.Arn}/index/GSI1
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  # Explicit log group so it has a retention period and `sam delete` removes it.
  ApiFunctionLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api
      RetentionInDays: 14

  # Live updates (#19): WebSocket API for the clients, and the stream Lambda that pushes table
  # changes to them (docs/data-model.md section 6).
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-ws
      ProtocolType: WEBSOCKET
      # Clients don't send messages; everything that isn't connect/disconnect goes to $default.
      RouteSelectionExpression: $request.body.action

  WebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketFunction.Arn}/invocations

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      Target: !Sub integrations/${WebSocketIntegration}

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Sub integrations/${WebSocketIntegration}

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      Target: !Sub integrations/${WebSocketIntegration}

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref WebSocketStageName
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100

  WebSocketFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: brainstorm.ws.lambda_handler
      LoggingConfig:
        LogGroup: !Ref WebSocketFunctionLogs
      Environment:
        Variables:
          BRAINSTORM_TABLE: !Ref Table
      Policies:
        - Statement:
            # connect: read the room, put the two connection items (a transaction), delete them
            # again if the room closed meanwhile; disconnect: read the lookup, delete both.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt Table.Arn

  WebSocketPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  WebSocketFunctionLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-ws
      RetentionInDays: 14

  StreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: brainstorm.broadcast.lambda_handler
      # A batch fans out to every connection of each room it touches.
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref StreamFunctionLogs
      Environment:
        Variables:
          BRAINSTORM_TABLE: !Ref Table
          WEBSOCKET_ENDPOINT: !Sub https://${WebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${WebSocketStageName}
      Policies:
        - Statement:
            # List a room's connections; delete gone ones (both items, in a transaction).
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:DeleteItem
              Resource: !GetAtt Table.Arn
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/${WebSocketStageName}/*/@connections/*
            # Read this table's stream only. (SAM's DynamoDB event would attach
            # AWSLambdaDynamoDBExecutionRole instead, which can read every stream in the account.)
            - Effect: Allow
              Action:
                - dynamodb:DescribeStream
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
                - dynamodb:ListStreams
              Resource: !GetAtt Table.StreamArn
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt StreamFailures.Arn

  StreamMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref StreamFunction
      EventSourceArn: !GetAtt Table.StreamArn
      StartingPosition: LATEST
      # Latency matters more than throughput: invoke as soon as records arrive, in small batches.
      BatchSize: 25
      MaximumBatchingWindowInSeconds: 0
      FunctionResponseTypes: [ReportBatchItemFailures]
      # Don't start the function for items that never become a message (connections change every
      # time a board opens or closes). A record passes if any pattern matches: inserts and updates
      # by their new image, deletes by their old one. tests/infra keeps this list in line with
      # stream_events.to_event.
      FilterCriteria:
        Filters:
          - Pattern: '{"dynamodb": {"NewImage": {"entity_type": {"S": [{"anything-but": ["CONNECTION", "CONNECTION_LOOKUP", "VOTE", "ROOM_CODE"]}]}}}}'
          - Pattern: '{"eventName": ["REMOVE"], "dynamodb": {"OldImage": {"entity_type": {"S": [{"anything-but": ["CONNECTION", "CONNECTION_LOOKUP", "VOTE", "ROOM_CODE"]}]}}}}'
      # A record that keeps failing is split out, retried a few times, then reported to the
      # queue, so it can't block the rest of its shard.
      BisectBatchOnFunctionError: true
      MaximumRetryAttempts: 3
      MaximumRecordAgeInSeconds: 3600
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt StreamFailures.Arn

  StreamFunctionLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-stream
      RetentionInDays: 14

  # Stream records the live-update function gave up on. Each message says which shard and
  # sequence numbers failed, not the record itself.
  StreamFailures:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # Web client (#8): private S3 bucket served over HTTPS by CloudFront.
  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName} web client
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # Managed "CachingOptimized" policy.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  Budget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref BudgetEmail }
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref BudgetEmail }

Outputs:
  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  WebSocketUrl:
    Description: WebSocket API URL for live updates (add ?room_id=<id>)
    Value: !Sub wss://${WebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${WebSocketStageName}
  StreamFailuresQueueUrl:
    Description: Stream records the live-update function gave up on
    Value: !Ref StreamFailures
  WebUrl:
    Description: Hosted web client
    Value: !Sub https://${WebDistribution.DomainName}
  WebBucketName:
    Description: Upload the web client here
    Value: !Ref WebBucket
  WebDistributionId:
    Description: CloudFront distribution (for cache invalidations)
    Value: !Ref WebDistribution
  TableName:
    Description: DynamoDB table (BRAINSTORM_TABLE)
    Value: !Ref Table
